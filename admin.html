<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - SAKO SIT Lampung</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 font-sans text-slate-800">

    <!-- Header Admin -->
    <header class="bg-emerald-800 text-white py-4 px-6 shadow-md flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <span class="text-2xl">⚙️</span>
            <div>
                <h1 class="font-bold text-lg leading-tight">Dashboard Admin SAKO SIT</h1>
                <p class="text-xs text-emerald-200">Pengelolaan Data & Sertifikat</p>
            </div>
        </div>
        <a href="index.html" class="text-xs bg-emerald-700 hover:bg-emerald-600 px-3 py-2 rounded-lg transition">
            <i class="fa-solid fa-globe mr-1"></i> Lihat Web Utama
        </a>
    </header>

    <div class="max-w-6xl mx-auto p-4 md:p-6">
        <!-- Navigation Tabs -->
        <div class="flex space-x-2 border-b border-slate-300 mb-6">
            <button onclick="switchTab('pendaftar')" id="tab-pendaftar" class="px-4 py-2 text-sm font-semibold border-b-2 border-emerald-600 text-emerald-800 focus:outline-none">
                📋 Data Pendaftar
            </button>
            <button onclick="switchTab('sertifikat')" id="tab-sertifikat" class="px-4 py-2 text-sm font-semibold text-slate-500 hover:text-emerald-800 focus:outline-none">
                📜 Tambah Sertifikat
            </button>
            <button onclick="switchTab('gudep')" id="tab-gudep" class="px-4 py-2 text-sm font-semibold text-slate-500 hover:text-emerald-800 focus:outline-none">
                🏫 Tambah Gudep
            </button>
        </div>

        <!-- TAB 1: Data Pendaftar -->
        <div id="section-pendaftar" class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
            <div class="flex justify-between items-center mb-4">
                <h2 class="font-bold text-slate-700">Daftar Peserta Kegiatan</h2>
                <button onclick="loadPendaftar()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded border">
                    🔄 Refresh Data
                </button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs text-slate-600">
                    <thead class="bg-slate-50 text-slate-700 uppercase font-bold border-b">
                        <tr>
                            <th class="p-3">No. Reg</th>
                            <th class="p-3">Nama</th>
                            <th class="p-3">Asal Sekolah</th>
                            <th class="p-3">Kab/Kota</th>
                            <th class="p-3">Tingkat</th>
                            <th class="p-3">WhatsApp</th>
                        </tr>
                    </thead>
                    <tbody id="table-pendaftar">
                        <tr><td colspan="6" class="p-4 text-center">Memuat data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- TAB 2: Tambah Sertifikat -->
        <div id="section-sertifikat" class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 hidden max-w-lg mx-auto">
            <h2 class="font-bold text-slate-700 mb-4">Input Sertifikat Baru</h2>
            <form onsubmit="addSertifikat(event)" class="space-y-4 text-sm">
                <div>
                    <label class="block font-semibold mb-1">Nomor Sertifikat</label>
                    <input type="text" id="cert-num" required placeholder="Contoh: SAKO-2026-00128" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
                <div>
                    <label class="block font-semibold mb-1">Nama Peserta</label>
                    <input type="text" id="cert-name" required placeholder="Nama Lengkap" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
                <div>
                    <label class="block font-semibold mb-1">Nama Kegiatan</label>
                    <input type="text" id="cert-event" required placeholder="Kemah Akbar / Gladian Pemimpin Satuan" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
                <div>
                    <label class="block font-semibold mb-1">Tanggal Terbit</label>
                    <input type="date" id="cert-date" required class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg transition">
                    Simpan Sertifikat
                </button>
            </form>
        </div>

        <!-- TAB 3: Tambah Gudep -->
        <div id="section-gudep" class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 hidden max-w-lg mx-auto">
            <h2 class="font-bold text-slate-700 mb-4">Tambah Gugus Depan Baru</h2>
            <form onsubmit="addGudep(event)" class="space-y-4 text-sm">
                <div>
                    <label class="block font-semibold mb-1">Nama Sekolah / SIT</label>
                    <input type="text" id="gudep-name" required placeholder="Contoh: SDIT Mutiara Hati" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
                <div>
                    <label class="block font-semibold mb-1">Nomor Gudep</label>
                    <input type="text" id="gudep-no" required placeholder="Contoh: 03.045" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
                <div>
                    <label class="block font-semibold mb-1">Kabupaten / Kota</label>
                    <input type="text" id="gudep-kab" required placeholder="Contoh: Lampung Selatan" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block font-semibold mb-1">Jumlah Anggota</label>
                        <input type="number" id="gudep-anggota" value="0" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
                    </div>
                    <div>
                        <label class="block font-semibold mb-1">Jumlah Pembina</label>
                        <input type="number" id="gudep-pembina" value="0" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
                    </div>
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg transition">
                    Simpan Gudep
                </button>
            </form>
        </div>
    </div>

    <script>
        // MASUKKAN KUNCI SUPABASE ANDA DI SINI
        const SUPABASE_URL = 'https://nzcmvlhoanfvvrgtrozo.supabase.co/rest/v1/';
        const SUPABASE_KEY = 'sb_publishable_8pYWcygUPYcksxqe2ylLRg_2RK4U58W';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Proteksi Kata Sandi Admin Sederhana
const PASSWORD_ADMIN = "sako2026"; // Anda bisa mengganti kata sandi ini kapan saja

if (sessionStorage.getItem("admin_login") !== "true") {
    const inputPass = prompt("Masukkan Kata Sandi Admin SAKO SIT Lampung:");
    if (inputPass === PASSWORD_ADMIN) {
        sessionStorage.setItem("admin_login", "true");
    } else {
        alert("Kata sandi salah! Akses ditolak.");
        window.location.href = "index.html";
    }
}

        // Tab Switcher
        function switchTab(tab) {
            ['pendaftar', 'sertifikat', 'gudep'].forEach(t => {
                document.getElementById('section-' + t).classList.add('hidden');
                document.getElementById('tab-' + t).classList.remove('border-b-2', 'border-emerald-600', 'text-emerald-800');
                document.getElementById('tab-' + t).classList.add('text-slate-500');
            });

            document.getElementById('section-' + tab).classList.remove('hidden');
            document.getElementById('tab-' + tab).classList.add('border-b-2', 'border-emerald-600', 'text-emerald-800');
            document.getElementById('tab-' + tab).classList.remove('text-slate-500');

            if (tab === 'pendaftar') loadPendaftar();
        }

        // Load Pendaftar
        async function loadPendaftar() {
            const table = document.getElementById('table-pendaftar');
            const { data, error } = await _supabase.from('pendaftaran').select('*').order('created_at', { ascending: false });

            if (error || !data || data.length === 0) {
                table.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-slate-400">Belum ada data pendaftar.</td></tr>`;
                return;
            }

            table.innerHTML = data.map(item => `
                <tr class="border-b hover:bg-slate-50">
                    <td class="p-3 font-mono font-semibold text-emerald-700">${item.no_registrasi || '-'}</td>
                    <td class="p-3 font-semibold">${item.nama_lengkap}</td>
                    <td class="p-3">${item.asal_sekolah}</td>
                    <td class="p-3">${item.kabupaten}</td>
                    <td class="p-3"><span class="bg-slate-100 px-2 py-0.5 rounded text-slate-600">${item.tingkat}</span></td>
                    <td class="p-3"><a href="https://wa.me/${item.no_whatsapp}" target="_blank" class="text-emerald-600 hover:underline">📱 ${item.no_whatsapp}</a></td>
                </tr>
            `).join('');
        }

        // Add Sertifikat
        async function addSertifikat(e) {
            e.preventDefault();
            const { error } = await _supabase.from('sertifikat').insert([{
                nomor_sertifikat: document.getElementById('cert-num').value.trim(),
                nama_peserta: document.getElementById('cert-name').value.trim(),
                nama_kegiatan: document.getElementById('cert-event').value.trim(),
                tanggal_terbit: document.getElementById('cert-date').value
            }]);

            if (error) {
                alert('Gagal menyimpan sertifikat: ' + error.message);
            } else {
                alert('✅ Sertifikat berhasil ditambahkan!');
                e.target.reset();
            }
        }

        // Add Gudep
        async function addGudep(e) {
            e.preventDefault();
            const { error } = await _supabase.from('gudep').insert([{
                nama_sekolah: document.getElementById('gudep-name').value.trim(),
                no_gudep: document.getElementById('gudep-no').value.trim(),
                kabupaten: document.getElementById('gudep-kab').value.trim(),
                jumlah_anggota: parseInt(document.getElementById('gudep-anggota').value) || 0,
                jumlah_pembina: parseInt(document.getElementById('gudep-pembina').value) || 0
            }]);

            if (error) {
                alert('Gagal menyimpan Gudep: ' + error.message);
            } else {
                alert('✅ Gudep berhasil ditambahkan!');
                e.target.reset();
            }
        }

        // Initial Load
        window.addEventListener('DOMContentLoaded', loadPendaftar);
    </script>
</body>
</html>
